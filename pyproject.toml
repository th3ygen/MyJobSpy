[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Distribution name only - the import name stays `jobspy`. Renamed from
# upstream's "python-jobspy" so the two cannot be installed over each other.
name = "myjobspy"
version = "0.1.0"
description = "Malaysian job scraper: JobStreet, Hiredly, Indeed Malaysia and LinkedIn in one pandas DataFrame, with MY location, MYR salary and remote-scope normalization"
# Upstream authors kept: this is a fork of their MIT-licensed JobSpy.
authors = [
    "Aidil <th3ygen@gmail.com>",
    "Cullen Watson <cullen@cullenwatson.com>",
    "Zachary Hampton <zachary@zacharysproducts.com>",
]
homepage = "https://github.com/th3ygen/MyJobSpy"
readme = "README.md"
keywords = ["jobs-scraper", "malaysia", "jobstreet", "hiredly", "indeed", "linkedin"]
[[tool.poetry.packages]]
include = "jobspy"

[tool.black]
line-length = 88

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.2"
pandas = "^2.1.0"
numpy = ">=1.26.0"
pydantic = "^2.3.0"
tls-client = "^1.0.1"
markdownify = "^1.1.0"
regex = "^2024.4.28"
rapidfuzz = "^3.9.0"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
black = "*"
pre-commit = "*"
pytest = "^8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real job boards over the network (deselected by default)",
]
addopts = "-m 'not live'"
