name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor pyproject declares, and the version this fork is developed on.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      # Offline only: the `live` marker is deselected by pyproject's addopts,
      # so CI never touches a real job board.
      - name: Run tests
        run: poetry run pytest
